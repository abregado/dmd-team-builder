<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121418" />
    <title>DMD Team Builder</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="app">
      <button type="button" id="main-button" class="main-button" disabled>Loading…</button>

      <section class="panel">
        <div class="panel-head">
          <h2>Team abilities</h2>
          <span class="hint">min – max</span>
        </div>
        <div id="limits" class="limits"></div>
      </section>

      <section class="panel players-panel">
        <div class="panel-head">
          <h2>Players</h2>
        </div>
        <ul id="players" class="players"></ul>
        <button type="button" id="add-player" class="add-player">+ Add player</button>
      </section>
    </main>

    <dialog id="picker">
      <div class="picker-body">
        <h3 id="picker-title"></h3>
        <div id="picker-options" class="picker-options"></div>
      </div>
    </dialog>
  </body>
</html>
